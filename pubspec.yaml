name: morehomesapp
description: "MoreHomes mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_svg: ^2.0.9
  font_awesome_flutter: ^10.12.0
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.0
  provider: ^6.1.5+1
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.14.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  lottie: ^3.0.0
  carousel_slider: ^5.1.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  loading_animation_widget: ^1.3.0
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"

  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/logo_forground.png"

  min_sdk_android: 21
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

  windows:
    generate: true
    image_path: "assets/icons/logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/logo.png
    - assets/icons/logo_forground.png
    - assets/logo/logo.png
